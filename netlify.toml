# Public demo: front end only; predictions come from frontend/src/demo/demoData.json
# (generated by backend/python/export_demo_data.py).
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "build"

[build.environment]
  REACT_APP_DEMO = "true"
  NODE_VERSION = "20"
  CI = "false"
